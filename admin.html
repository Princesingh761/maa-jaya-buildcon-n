<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard | Maa Jaya Buildcon</title>
<style>
:root{--green:#09251d;--green2:#123a2e;--orange:#ef5b2a;--bg:#f4f6f3;--card:#fff;--text:#17211d;--muted:#718079;--line:#e2e7e3;--red:#c0392b;--blue:#2471a3;--yellow:#b9770e;--ok:#217a43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}.hidden{display:none!important}
.top{height:70px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.brand{font-weight:800;letter-spacing:.04em}.top-actions{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:5px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.orange{background:var(--orange);color:#fff}.btn.light{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff}.btn.gray{background:#fff;border:1px solid var(--line);color:var(--green)}.btn.red{background:#fff1ef;color:var(--red);border:1px solid #ffd2cc}.btn.small{padding:7px 10px;font-size:12px}
.wrap{max-width:1250px;margin:0 auto;padding:30px 20px}.login{max-width:460px;margin:70px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 7px 24px rgba(0,0,0,.05)}
.login .card{padding:30px}.login h1{font-size:25px;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;margin:0 0 24px}
.field{margin-bottom:15px}.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d8dfda;border-radius:5px;outline:0}.field input:focus{border-color:var(--orange)}
.msg{padding:11px 13px;border-radius:6px;font-size:13px;margin-bottom:15px}.msg.err{background:#fff0ee;color:var(--red)}.msg.ok{background:#ebf8ef;color:var(--ok)}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.head h1{margin:0;font-size:29px}.head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.stat{padding:20px}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.stat b{display:block;font-size:29px;margin-top:7px}
.toolbar{padding:15px;display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;padding:11px 12px;border:1px solid var(--line);border-radius:5px}.toolbar select{padding:10px;border:1px solid var(--line);border-radius:5px;background:#fff}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#fafbfa}.table tr:hover td{background:#fcfdfc}.muted{color:var(--muted)}.badge{display:inline-block;padding:4px 9px;border-radius:99px;font-size:10px;font-weight:800;text-transform:uppercase}.badge.new{background:#fff0ee;color:var(--red)}.badge.contacted{background:#fff7e7;color:var(--yellow)}.badge.in_progress{background:#eaf3fb;color:var(--blue)}.badge.closed{background:#ebf8ef;color:var(--ok)}
.actions-cell{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;padding:45px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-card{background:#fff;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:10px}.modal-head{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.modal-head h2{margin:0;font-size:21px}.close{border:0;background:#f1f3f1;border-radius:50%;width:34px;height:34px;cursor:pointer}.modal-body{padding:20px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:16px}.detail div{border-bottom:1px solid var(--line);padding-bottom:12px}.detail label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:700;margin-bottom:5px}.detail p{margin:0;font-size:14px;white-space:pre-wrap}.message-box{grid-column:1/-1}.modal-footer{padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.top{padding:0 15px}.wrap{padding:20px 12px}.detail{grid-template-columns:1fr}.message-box{grid-column:auto}.head{display:block}.head .btn{margin-top:12px}}
@media(max-width:480px){.stats{grid-template-columns:1fr}.brand{font-size:13px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">MAA JAYA BUILDCON — ADMIN</div>
  <div class="top-actions">
    <a class="btn light" href="index.html">View Website</a>
    <button class="btn light hidden" id="logout">Logout</button>
  </div>
</header>

<main class="wrap">
<section id="loginView" class="login">
  <div class="card">
    <h1>Admin Login</h1>
    <p class="sub">Only authorised administrators can access customer enquiries.</p>
    <div id="loginMsg" class="hidden"></div>
    <form id="loginForm">
      <div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn orange" style="width:100%" type="submit" id="loginBtn">Login to Dashboard</button>
    </form>
  </div>
</section>

<section id="dashboard" class="hidden">
  <div class="head">
    <div><h1>Enquiry Dashboard</h1><p>View, manage and remove enquiries submitted from the website.</p></div>
    <button class="btn gray" id="refresh">↻ Refresh</button>
  </div>

  <div class="stats">
    <div class="card stat"><span>Total Enquiries</span><b id="total">0</b></div>
    <div class="card stat"><span>New</span><b id="newCount">0</b></div>
    <div class="card stat"><span>In Progress</span><b id="progressCount">0</b></div>
    <div class="card stat"><span>Closed</span><b id="closedCount">0</b></div>
  </div>

  <div id="dashMsg" class="hidden"></div>
  <div class="card toolbar">
    <input id="search" placeholder="Search by name, phone, service or message...">
    <select id="statusFilter"><option value="">All Statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="in_progress">In Progress</option><option value="closed">Closed</option></select>
    <button class="btn gray" id="clear">Clear</button>
  </div>

  <div class="card table-wrap">
    <table class="table">
      <thead><tr><th>Date</th><th>Customer</th><th>Phone</th><th>Service</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h2 id="modalTitle">Enquiry</h2><button class="close" id="closeModal">×</button></div>
    <div class="modal-body"><div class="detail">
      <div><label>Name</label><p id="dName"></p></div>
      <div><label>Phone</label><p id="dPhone"></p></div>
      <div><label>Service</label><p id="dService"></p></div>
      <div><label>Date</label><p id="dDate"></p></div>
      <div class="message-box"><label>Message</label><p id="dMessage"></p></div>
    </div></div>
    <div class="modal-footer">
      <select id="modalStatus"><option value="new">New</option><option value="contacted">Contacted</option><option value="in_progress">In Progress</option><option value="closed">Closed</option></select>
      <button class="btn orange" id="saveStatus">Save Status</button>
    </div>
  </div>
</div>

<script>
const API_BASE = window.MJB_API_BASE || '/api';
let enquiries = [];
let selectedId = null;

const $ = id => document.getElementById(id);
const token = () => localStorage.getItem('mjb_admin_token');

function showMsg(el,text,type='err'){el.className='msg '+type;el.textContent=text}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function date(v){return v ? new Date(v).toLocaleString() : '—'}

async function api(path, options={}){
  const headers={...(options.headers||{}),Authorization:`Bearer ${token()}`};
  if(options.body && !headers['Content-Type']) headers['Content-Type']='application/json';
  const res=await fetch(API_BASE+path,{...options,headers});
  const data=await res.json().catch(()=>({}));
  if(res.status===401||res.status===403){localStorage.removeItem('mjb_admin_token');showLogin();throw new Error(data.message||'Session expired.')}
  if(!res.ok) throw new Error(data.message||'Request failed');
  return data;
}

function showLogin(){
  $('loginView').classList.remove('hidden');$('dashboard').classList.add('hidden');$('logout').classList.add('hidden');
}
function showDash(){
  $('loginView').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');load();
}

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); $('loginBtn').disabled=true; $('loginBtn').textContent='Signing in...';
  try{
    const f=new FormData(e.target);
    const res=await fetch(API_BASE+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:f.get('email'),password:f.get('password')})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.message||'Invalid email or password');
    localStorage.setItem('mjb_admin_token',data.token); showDash();
  }catch(err){showMsg($('loginMsg'),err.message)}
  finally{$('loginBtn').disabled=false;$('loginBtn').textContent='Login to Dashboard'}
});

$('logout').onclick=()=>{localStorage.removeItem('mjb_admin_token');showLogin()};
$('refresh').onclick=load;
$('clear').onclick=()=>{$('search').value='';$('statusFilter').value='';render()};
$('search').oninput=render;$('statusFilter').onchange=render;
$('closeModal').onclick=()=>$('modal').classList.add('hidden');
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};

async function load(){
  try{const data=await api('/admin/enquiries');enquiries=data.enquiries||[];updateStats();render()}
  catch(err){if(token())showMsg($('dashMsg'),err.message)}
}
function updateStats(){
  $('total').textContent=enquiries.length;
  $('newCount').textContent=enquiries.filter(x=>x.status==='new').length;
  $('progressCount').textContent=enquiries.filter(x=>x.status==='in_progress').length;
  $('closedCount').textContent=enquiries.filter(x=>x.status==='closed').length;
}
function render(){
  const q=$('search').value.toLowerCase().trim(), st=$('statusFilter').value;
  const list=enquiries.filter(x=>{
    const text=[x.name,x.phone,x.service,x.message].join(' ').toLowerCase();
    return (!q||text.includes(q))&&(!st||x.status===st)
  });
  $('rows').innerHTML=list.length?list.map(x=>`
    <tr>
      <td>${esc(new Date(x.created_at).toLocaleDateString())}<br><span class="muted">${esc(new Date(x.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))}</span></td>
      <td><b>${esc(x.name)}</b></td>
      <td>${esc(x.phone)}</td>
      <td>${esc(x.service||'—')}</td>
      <td><span class="badge ${esc(x.status)}">${esc((x.status||'new').replace('_',' '))}</span></td>
      <td class="actions-cell">
        <button class="btn gray small" onclick="viewEnquiry(${Number(x.id)})">View</button>
        <button class="btn red small" onclick="deleteEnquiry(${Number(x.id)})">Delete</button>
      </td>
    </tr>`).join(''):`<tr><td colspan="6" class="empty">No enquiries found.</td></tr>`;
}
window.viewEnquiry=id=>{
  const x=enquiries.find(e=>Number(e.id)===Number(id));if(!x)return;
  selectedId=x.id;$('modalTitle').textContent='Enquiry #'+x.id;$('dName').textContent=x.name||'—';$('dPhone').textContent=x.phone||'—';$('dService').textContent=x.service||'—';$('dDate').textContent=date(x.created_at);$('dMessage').textContent=x.message||'No message provided';$('modalStatus').value=x.status||'new';$('modal').classList.remove('hidden');
};
$('saveStatus').onclick=async()=>{
  if(selectedId==null)return;
  const b=$('saveStatus');b.disabled=true;b.textContent='Saving...';
  try{await api('/admin/enquiries/'+selectedId,{method:'PATCH',body:JSON.stringify({status:$('modalStatus').value})});$('modal').classList.add('hidden');await load()}
  catch(err){alert(err.message)}
  finally{b.disabled=false;b.textContent='Save Status'}
};
window.deleteEnquiry=async id=>{
  const x=enquiries.find(e=>Number(e.id)===Number(id));if(!x)return;
  if(!confirm(`Delete enquiry from ${x.name}? This cannot be undone.`))return;
  try{await api('/admin/enquiries/'+id,{method:'DELETE'});await load()}
  catch(err){alert(err.message)}
};
if(token())showDash();else showLogin();
</script>
</body>
</html>
